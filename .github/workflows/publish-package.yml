name: Publish Maven package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-package-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select immutable release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          tag="${RELEASE_TAG:-v$REQUESTED_VERSION}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag, received: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Set up JDK 21 and Maven registry authentication
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify tagged package version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          package_version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$package_version" != "$EXPECTED_VERSION" ]]; then
            echo "Tag version $EXPECTED_VERSION does not match pom.xml version $package_version" >&2
            exit 1
          fi
      - name: Verify package
        run: ./mvnw -B clean verify
      - name: Publish to GitHub Packages
        run: ./mvnw -B -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
