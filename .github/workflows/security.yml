name: Security Dashboard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    timeout-minutes: 60
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
      - name: Scan Maven and npm dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: dependency-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: target,node_modules
      - name: Publish dependencies to Security panel
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: dependency-results.sarif
          category: trivy/dependencies

  container:
    timeout-minutes: 60
    name: Container vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Package application
        run: ./mvnw -B -DskipTests package
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          pull: true
          tags: blog-app:scan
          cache-from: type=gha,scope=security-image
          cache-to: type=gha,mode=max,scope=security-image
      - name: Enforce hardened runtime policy
        env:
          IMAGE: blog-app:scan
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          mfa_password=$(openssl rand -hex 32)
          mfa_salt=$(openssl rand -hex 8)
          container_id=$(docker run --detach \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700,size=64m \
            --tmpfs /data:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700,size=64m \
            --tmpfs /native:rw,exec,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env BLOG_BASE_URL=http://localhost:8080 \
            --env BLOG_ADMIN_PASSWORD=policy-test-admin \
            --env BLOG_AUTHOR_PASSWORD=policy-test-author \
            --env BLOG_MFA_KEY="$mfa_password" \
            --env BLOG_MFA_ENCRYPTION_SALT="$mfa_salt" \
            --publish 127.0.0.1:8080:8080 \
            "$IMAGE")
          trap 'docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              docker image inspect --format 'Image size: {{.Size}} bytes' "$IMAGE"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1
      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blog-app:scan
          format: sarif
          output: container-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish container to Security panel
        if: ${{ always() && hashFiles('container-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: container-results.sarif
          category: trivy/container

  codeql:
    timeout-minutes: 60
    name: CodeQL Java analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: pom.xml
      - name: Build
        run: ./mvnw -B -DskipTests package
      - name: Analyze and publish CodeQL results
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:java-kotlin
