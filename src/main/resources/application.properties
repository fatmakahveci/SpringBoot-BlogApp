# Disable persistence access from the web layer; service transactions must load required data.
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.cache.type=simple
spring.cache.cache-names=seo-sitemap
# Redis health is enabled only by the opt-in redis profile.
management.health.redis.enabled=false
# Flyway owns the schema; Hibernate only checks that entity mappings still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
# Existing databases predate Flyway and already contain the V1 schema.
spring.flyway.baseline-version=1
# Enables HTML forms to submit PUT and DELETE through Spring's hidden _method field.
spring.mvc.hiddenmethod.filter.enabled=true
# The application is intentionally public and does not create a generated default user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

logging.level.org.hibernate.SQL=INFO
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Spring Boot Blog
info.app.description=Server-rendered blog and read-only JSON API
info.app.version=@project.version@

spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# Override BLOG_DATABASE_PATH to store the database outside the working directory.
spring.datasource.url=jdbc:sqlite:${BLOG_DATABASE_PATH:sample.db}

# Public origin used in canonical links, robots.txt, and sitemap.xml.
blog.seo.base-url=${BLOG_BASE_URL:http://localhost:8080}

# Avoid leaking exception details in HTTP error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
