# Enable with SPRING_PROFILES_ACTIVE=prod,redis when a shared cache is available.
spring.cache.type=redis
spring.cache.cache-names=seo-sitemap
spring.cache.redis.time-to-live=${BLOG_CACHE_TTL:10m}
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
management.health.redis.enabled=true
