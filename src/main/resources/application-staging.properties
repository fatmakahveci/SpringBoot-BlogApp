# Staging mirrors production security while retaining an independent environment identity.
blog.environment=staging
spring.datasource.url=jdbc:sqlite:${BLOG_DATABASE_PATH}
blog.seo.base-url=${BLOG_BASE_URL}
blog.security.require-configured-passwords=true
blog.security.mfa.encryption-password=${BLOG_MFA_KEY}
blog.security.mfa.encryption-salt=${BLOG_MFA_ENCRYPTION_SALT}

spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
server.compression.enabled=true

logging.structured.format.console=ecs
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:staging}
sentry.release=${BLOG_VERSION:${info.app.version}}
sentry.send-default-pii=false
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db
blog.rate-limit.trusted-scanner-addresses=${BLOG_SECURITY_SCANNER_ADDRESSES:}
