<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Create account | Blog</title>
        <meta name="robots" content="noindex,nofollow">
        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link th:href="@{/styles/main.css}" rel="stylesheet">
    </head>
    <body>
        <main class="container account-page px-3 py-4">
            <div class="card shadow-sm account-card">
                <div class="card-body p-3 p-sm-4">
                    <h3 class="mb-4">Create an account</h3>
                    <form th:action="@{/register}" th:object="${registration}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" type="text" th:field="*{username}" class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" autocomplete="username" maxlength="50" required autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password"
                                   aria-describedby="passwordRequirements" minlength="8" maxlength="72"
                                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])(?!.*\s).{8,72}"
                                   title="Use 8 to 72 characters with uppercase, lowercase, number, and special character; do not use spaces." required>
                            <div id="passwordRequirements" class="form-text">Use 8–72 characters, including uppercase and lowercase letters, a number, and a special character. Spaces are not allowed.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm password</label>
                            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" autocomplete="new-password" minlength="8" maxlength="72" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirmation error</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                    <p class="mt-3 mb-0 text-center">Already registered? <a th:href="@{/login}">Log in</a></p>
                    <p class="mt-2 mb-0 text-center"><a th:href="@{/}">Back to the blog</a></p>
                </div>
            </div>
        </main>
    </body>
</html>
