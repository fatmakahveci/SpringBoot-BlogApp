<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${tag.name + ' posts | Spring Blog'}">Topic | Spring Blog</title>
        <meta name="description" th:content="${'Browse published software articles filed under ' + tag.name + ' on Spring Blog.'}">
        <meta name="robots" content="index,follow">
        <link rel="canonical" th:href="${seoBaseUrl + '/tags/' + tag.id}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Spring Blog">
        <meta property="og:title" th:content="${tag.name + ' posts | Spring Blog'}">
        <meta property="og:description" th:content="${'Browse published software articles filed under ' + tag.name + '.'}">
        <meta property="og:url" th:content="${seoBaseUrl + '/tags/' + tag.id}">
        <meta name="twitter:card" content="summary">
        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link th:href="@{/styles/main.css}" rel="stylesheet">
        <script th:src="@{/scripts/main.js}" defer></script>
    </head>
    <body>
        <header class="site-header border-bottom">
            <nav class="container-xl navbar py-3 px-3">
                <a th:href="@{/}" class="navbar-brand d-flex align-items-center gap-2">
                    <span class="brand-mark" aria-hidden="true">B</span>
                    <span>Spring Blog</span>
                </a>
                <a th:href="@{/}" class="btn btn-outline-primary btn-sm ms-auto">All posts</a>
            </nav>
        </header>

        <main class="container-xl px-3 py-5">
            <section class="section-heading mb-4">
                <span class="eyebrow">Topic</span>
                <h1 class="display-6 fw-bold mb-2" th:text="${tag.name}">Topic name</h1>
                <p class="text-secondary mb-0">Published articles filed under this topic.</p>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/tags/{tagId}/edit(tagId=${tag.id})}" class="btn btn-outline-primary btn-sm mt-3">Edit topic</a>
            </section>

            <div class="post-list" th:if="${!#lists.isEmpty(posts)}">
                <article class="post-card" th:each="post : ${posts}">
                    <div class="d-flex flex-column flex-sm-row justify-content-between gap-3">
                        <div class="flex-grow-1">
                            <time class="post-meta" th:text="${post.createdAt}">Created</time>
                            <h2 class="h4 mt-2 mb-2">
                                <a class="post-link" th:href="@{/p/{slug}(slug=${post.slug})}" th:text="${post.title}">Title</a>
                            </h2>
                            <p class="post-summary mb-3" th:text="${post.summary != null and !post.summary.isBlank() ? post.summary : post.content}">Summary</p>
                            <div class="d-flex flex-wrap gap-2">
                                <a th:each="postTag : ${post.tags}" th:href="@{/tags/{tagId}(tagId=${postTag.id})}" class="tag-chip" th:text="${postTag.name}">Tag</a>
                            </div>
                        </div>
                        <div class="post-actions d-flex flex-sm-column align-items-start align-items-sm-end gap-2">
                            <a th:href="@{/p/{slug}(slug=${post.slug})}" class="btn btn-outline-primary btn-sm">Read post</a>
                            <a sec:authorize="hasAnyRole('AUTHOR', 'ADMIN')" th:href="@{/posts/{postId}(postId=${post.id})}" class="btn btn-light border btn-sm">Update</a>
                            <form sec:authorize="hasRole('ADMIN')" th:method="DELETE" data-confirm="Delete this post permanently?">
                                <button type="submit" th:formaction="@{/posts/{postId}(postId=${post.id})}" class="btn btn-outline-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </div>
                </article>
            </div>

            <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
                <div class="empty-state-icon" aria-hidden="true">⌕</div>
                <h2 class="h5">No posts in this topic yet</h2>
                <p class="text-secondary mb-3">No published posts use this tag yet. Published posts assigned to this topic will appear here.</p>
                <a th:href="@{/}" class="btn btn-primary">Browse all posts</a>
            </div>
        </main>
    </body>
</html>
