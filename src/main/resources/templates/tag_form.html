<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Edit topic | Spring Blog</title>
        <meta name="robots" content="noindex,nofollow">
        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link th:href="@{/styles/main.css(v='20260804-2')}" rel="stylesheet">
    </head>
    <body>
        <main class="container account-page px-3 py-4">
            <div class="card shadow-sm account-card">
                <div class="card-body p-3 p-sm-4">
                    <span class="eyebrow">Topic management</span>
                    <h1 class="h3 mb-4">Edit topic</h1>
                    <form th:action="@{/tags/{tagId}(tagId=${tag.id})}" th:object="${tag}" th:method="PUT" novalidate>
                        <div class="mb-4">
                            <label for="topic-name" class="form-label">Topic name</label>
                            <input id="topic-name" type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                                   maxlength="50" autocomplete="off" required autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Topic name error</div>
                        </div>
                        <div class="d-flex flex-column flex-sm-row gap-2">
                            <button type="submit" class="btn btn-primary">Save changes</button>
                            <a th:href="@{/tags/{tagId}(tagId=${tag.id})}" class="btn btn-light border">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
