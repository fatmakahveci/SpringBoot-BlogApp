<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${post.title + ' | Spring Blog'}">Post | Spring Blog</title>
        <meta name="description" th:content="${#strings.abbreviate(post.summary != null and !post.summary.isBlank() ? post.summary : post.content, 160)}">
        <meta name="robots" th:content="${seoNoIndex} ? 'noindex,nofollow' : 'index,follow,max-image-preview:large'">
        <link rel="canonical" th:href="${seoBaseUrl + '/p/' + post.slug}">
        <meta property="og:type" content="article">
        <meta property="og:site_name" content="Spring Blog">
        <meta property="og:title" th:content="${post.title}">
        <meta property="og:description" th:content="${#strings.abbreviate(post.summary != null and !post.summary.isBlank() ? post.summary : post.content, 160)}">
        <meta property="og:url" th:content="${seoBaseUrl + '/p/' + post.slug}">
        <meta property="article:published_time" th:content="${post.createdAt}">
        <meta property="article:modified_time" th:content="${post.updatedAt}">
        <meta name="twitter:card" content="summary">
        <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link th:href="@{/styles/main.css(v='20260804-4')}" rel="stylesheet">
    </head>
    <body>
        <main class="container post-detail py-4 py-md-5 px-3">
            <nav class="mb-3" aria-label="Breadcrumb">
                <a th:href="@{/}" class="btn btn-light border btn-sm">← Back to all posts</a>
            </nav>
            <article>
                <span class="eyebrow">Article</span>
                <h1 class="post-title" th:text="${post.title}">Post title</h1>
                <p class="text-muted">
                    <span th:text="${post.createdAt}">Created</span>
                    <span th:if="${post.updatedAt != post.createdAt}" th:text="| · Updated ${post.updatedAt}|">Updated</span>
                </p>
                <p class="lead" th:if="${post.summary != null and !post.summary.isBlank()}" th:text="${post.summary}">Summary</p>
                <hr class="my-4">
                <div class="post-detail-body" th:text="${post.content}">Content</div>
                <div class="mt-4">
                    <a th:each="tag : ${post.tags}" th:href="@{/tags/{id}(id=${tag.id})}" class="tag-chip me-1" th:text="${tag.name}">Tag</a>
                </div>
            </article>
        </main>
    </body>
</html>
