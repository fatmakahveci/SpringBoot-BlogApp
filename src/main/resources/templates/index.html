<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Blog</title>
		<link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
		<link th:href="@{/styles/main.css}" rel="stylesheet" />
	</head>
	<body>
		<div class="container-fluid text-center">
			<div class="d-flex justify-content-end gap-2 pt-3">
				<a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-outline-primary btn-sm">Log in</a>
				<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<span class="me-2" sec:authentication="name"></span>
					<button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
				</form>
			</div>
			<div class="container-fluid text-center">
				<br><h3>Welcome to my blog</h3><br>
			</div>

			<div class="modal-body row">
				<div class="col-md-8">
					<img th:src="@{/images/blog.png}" class="img-fluid" alt="Blog illustration">
					<div sec:authorize="hasAnyRole('AUTHOR', 'ADMIN')" style="text-align: right;">
						<br>
						<a th:href="@{/posts/add}" class="btn btn-primary btn-sm mb-3">Create new post</a>
					</div>
					<form th:action="@{/}" method="get" class="row g-2 mb-3 text-start">
						<div class="col-md-6">
							<label for="post-search" class="visually-hidden">Search post titles</label>
							<input id="post-search" type="search" name="query" th:value="${query}" class="form-control" placeholder="Search post titles...">
						</div>
						<div class="col-md-4">
							<label for="post-sort" class="visually-hidden">Sort posts</label>
							<select id="post-sort" name="sort" class="form-select">
								<option value="newest" th:selected="${sort == 'newest'}">Newest first</option>
								<option value="oldest" th:selected="${sort == 'oldest'}">Oldest first</option>
								<option value="titleAsc" th:selected="${sort == 'titleAsc'}">Title A–Z</option>
								<option value="titleDesc" th:selected="${sort == 'titleDesc'}">Title Z–A</option>
							</select>
						</div>
						<input type="hidden" name="size" th:value="${size}">
						<div class="col-md-2 d-grid"><button type="submit" class="btn btn-outline-primary">Apply</button></div>
					</form>

					<table class="table table-hover">
						<thead>
							<tr>
								<th>Title</th>
								<th>Content</th>
								<th>Created</th>
								<th>Tags</th>
								<th sec:authorize="hasAnyRole('AUTHOR', 'ADMIN')">Actions</th>
								<th sec:authorize="hasRole('ADMIN')">Administration</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="post:${posts}">
								<td><a th:href="@{/p/{slug}(slug=${post.slug})}" th:text="${post.title}">Title</a></td>
								<td>
									<span th:text="${post.summary != null and !post.summary.isBlank() ? post.summary : post.content}"></span>
									<span th:if="${post.status.name() == 'DRAFT'}" class="badge text-bg-secondary ms-1">Draft</span>
								</td>
								<td th:text="${post.createdAt}"></td>
								<td th:text="${#strings.listJoin(post.tags.![name], ',')}"></td>
								<td sec:authorize="hasAnyRole('AUTHOR', 'ADMIN')">
									<a th:href="@{/posts/{postId}(postId=${post.id})}" class="btn btn-primary btn-sm mb-3">Update</a>
								</td>
								<td sec:authorize="hasRole('ADMIN')">
									<form action="" th:method="DELETE">
										<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
										<button type="submit" value="delete_post" th:formaction="@{/posts/{postId}(postId=${post.id})}" class="btn btn-primary btn-sm">Delete</button>
									</form>
								</td>
							</tr>
						</tbody>
					</table>
					<p th:if="${#lists.isEmpty(posts)}" class="text-muted">No posts match your search.</p>
					<nav th:if="${postPage != null and postPage.totalPages > 1}" aria-label="Post pages">
						<ul class="pagination justify-content-center">
							<li class="page-item" th:classappend="${postPage.first} ? 'disabled'">
								<a class="page-link" th:href="@{/(page=${postPage.number - 1},size=${size},query=${query},sort=${sort})}">Previous</a>
							</li>
							<li class="page-item disabled"><span class="page-link" th:text="|Page ${postPage.number + 1} of ${postPage.totalPages}|">Page</span></li>
							<li class="page-item" th:classappend="${postPage.last} ? 'disabled'">
								<a class="page-link" th:href="@{/(page=${postPage.number + 1},size=${size},query=${query},sort=${sort})}">Next</a>
							</li>
						</ul>
					</nav>
				</div>

				<div class="col-md-4 border">
					<br>
					<h4>Tags</h4>
					<form sec:authorize="hasAnyRole('AUTHOR', 'ADMIN')" action="#" th:action="@{/tags}" th:object="${tag}" method="POST" novalidate>
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<div class="btn-group" role="group" aria-label="Basic example">
							<input type="text" id="form3" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" maxlength="50" required placeholder="Write tags here..."/>
							<button type="submit" value="save_tag" th:formaction="@{/tags}" class="btn btn-primary btn-sm">Create</button>
						</div>
						<div class="text-danger small text-start" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Tag error</div>
					</form>
						<br><br>
						<table class="table">
							<tr th:each="tag:${tags}">
								<td><a th:href="@{/tags/{tagId}(tagId=${tag.id})}" class="btn btn-outline-primary btn-sm" th:text="${tag.name}">Success</a></td>
								<td sec:authorize="hasRole('ADMIN')"><form action="" th:method="DELETE">
									<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
									<button type="submit" value="delete_tag" th:formaction="@{/tags/{tagId}(tagId=${tag.id})}" class="btn btn-primary btn-sm">Delete</button>
								</form>
								</td>
							</tr>
						</table>
					
				</div>
			</div>
		</div>
	</body>
</html>
