# Keep browser tests isolated from development data and from one another.
spring.datasource.url=jdbc:sqlite:file:e2e-tests?mode=memory&cache=shared
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false

# Stable credentials prevent random secrets and nondeterministic startup logs.
BLOG_ADMIN_PASSWORD=e2e-admin-password
BLOG_AUTHOR_PASSWORD=e2e-author-password

# Keep Playwright's captured web-server output focused on failures.
logging.level.root=INFO
logging.level.org.springframework.web=INFO
spring.main.log-startup-info=false
