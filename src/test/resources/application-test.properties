# Give each Spring test context its own shared in-memory SQLite database.
spring.datasource.url=jdbc:sqlite:file:${random.uuid}?mode=memory&cache=shared
# A single pooled connection keeps the in-memory database alive and avoids SQLite write contention.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Keep test output deterministic and avoid generating temporary account passwords.
BLOG_ADMIN_PASSWORD=test-admin-password
BLOG_AUTHOR_PASSWORD=test-author-password

# Integration tests share loopback addresses; policy boundaries are covered by RateLimitFilterTests.
blog.rate-limit.anonymous-per-minute=10000
blog.rate-limit.author-per-minute=10000
blog.rate-limit.admin-per-minute=10000
blog.rate-limit.login-per-minute=10000
blog.rate-limit.register-per-hour=10000
